x;padding:10px;min-width:0;color:#5c4865}input[type=search]{width:min(100%,360px)}label{display:flex;flex-direction:column;gap:5px;font-size:13px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}.bookrow{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;background:#f5eef6;margin:5px 0}.bookrow.done{background:#e5f0e8}.letter{width:35px;min-width:35px;text-align:center;padding:9px 0;border-radius:9px;background:#e6d8f0;font-weight:bold}.bookrow.done .letter{background:#bdddc7}.bookrow small{display:block;color:#98819b}.bingo{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.tile{min-height:85px;padding:7px 3px;font-size:12px;background:#f8e0ea;border:2px solid transparent}.tile.hard{background:#e9d9f4}.tile.done{background:#d1e8d8;border-color:#8fb79e}.bar{height:12px;background:#e9dcec;border-radius:20px;overflow:hidden}.bar div{height:100%;background:#a7cbb3;transition:width .2s}.monthgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.month{background:#f6edf6;padding:13px;border-radius:15px;text-align:left}.month b{display:block}.month span{font-size:12px}.booklist{max-height:380px;overflow:auto}.note{background:#e8f0e8;padding:12px;border-radius:12px;font-size:13px}.hidden{display:none!important}h2{font-family:Georgia,serif;font-weight:normal;margin:0 0 12px}h3{font-family:Georgia,serif}.pill{display:inline-block;border-radius:100px;background:#f0e1ef;padding:5px 9px;font-size:12px}.footer{font-size:12px;color:#987e9b;text-align:center;margin:30px 0}@media(max-width:600px){.shell{padding:10px}.panel{padding:14px}.cards{gap:6px}.stat{padding:10px}.stat strong{font-size:23px}.grid,.form{grid-template-columns:1fr}.monthgrid{grid-template-columns:repeat(2,1fr)}.tile{font-size:10px;min-height:78px}.nav button{font-size:12px;padding:9px}}

/* Boutique bookcase: each group of three books stands on its own oak ledge. */
.boutique-shelves{max-width:510px;margin:20px auto 24px;padding:20px 18px 24px;background:#f6f2e9;border:1px solid #e5dacc;border-radius:8px;box-shadow:inset 0 0 0 6px #faf7f1,0 7px 22px #4b352b14}

.botanical{font:38px Georgia,serif;color:#88927c}.vase{font:26px Georgia,serif;color:#b78e91}.decor-label{font:10px Georgia,serif;letter-spacing:2.6px;color:#786a5c;text-align:center;border-top:1px solid #c8b7a0;border-bottom:1px solid #c8b7a0;padding:8px 4px}

.boutique-row .cover-book .cover-placeholder{width:92%;padding:8px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#b7bbaa,#7d8d80);color:#fff;font:12px Georgia,serif;text-align:center;overflow:hidden;overflow-wrap:anywhere}
.oak-ledge{height:13px;background:linear-gradient(#d7b78f 0%,#b98f62 32%,#98734d 77%,#b18b61 100%);border-radius:2px;box-shadow:0 5px 0 #e0c6a3,0 8px 9px #5d422d36;position:relative}
.oak-ledge:before{content:"";position:absolute;top:1px;left:0;right:0;border-top:1px solid #f3d9b7}
.boutique-end{text-align:center;font:italic 12px Georgia,serif;color:#8b8276;margin-top:8px}
@media(max-width:600px){.boutique-shelves{padding:18px 12px 20px;margin:16px auto}.book-display{gap:9px;padding:0 5px;min-height:144px}.boutique-row .cover-book{height:141px}.boutique-row .cover-book img,.boutique-row .cover-book .cover-placeholder{height:132px}.boutique-row{margin-bottom:26px}}

/* The Reading Room · spine-out library edition */
.boutique-shelves{max-width:560px;margin:20px auto 24px;padding:22px 13px 20px;background:linear-gradient(90deg,#eadfce 0,#faf7f0 5%,#faf7f0 95%,#e8d9c5 100%);border:5px solid #d5b993;box-shadow:inset 0 0 0 2px #f7e9d5,0 8px 24px #4b352b18;border-radius:5px}
.boutique-shelves .shelf-decor{margin:2px 8px 24px}.boutique-shelves .decor-label{font-size:10px}
.boutique-row{margin:0 0 26px}.book-display.spine-display{display:flex;align-items:flex-end;justify-content:center;gap:2px;padding:12px 6px 0;min-height:182px;overflow:visible;background:linear-gradient(180deg,transparent 83%,#eadfcd35)}
.spine-book{position:relative;display:flex;align-items:center;justify-content:center;flex:0 1 auto;min-width:19px;width:var(--book-width);height:var(--book-height);border:1px solid #ffffff45;border-left:3px solid #ffffff38;border-right:2px solid #382b2533;border-radius:3px 5px 1px 1px;padding:7px 2px 8px;background:var(--book-color);color:var(--book-ink);box-shadow:inset 3px 0 #ffffff24,inset -2px 0 #00000012,2px 3px 4px #32241b24;cursor:pointer;overflow:hidden;transition:transform .15s ease,filter .15s ease}
.spine-book:nth-child(7n+2){border-top:3px double #d7bc80}.spine-book:nth-child(9n+5){border-top:3px solid #e8d7b5}
.spine-book:focus-visible{outline:3px solid #657965;outline-offset:2px}.spine-book:active{transform:translateY(-5px)}
.spine-book .spine-title{display:block;writing-mode:vertical-rl;transform:rotate(180deg);font:600 clamp(9px,2.2vw,11px)/1.1 Georgia,serif;letter-spacing:.15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:calc(var(--book-height) - 19px);text-shadow:0 1px #00000009}
.spine-book .spine-rule{position:absolute;left:4px;right:4px;bottom:5px;height:1px;background:currentColor;opacity:.45}
.shelf-ornament{flex:0 0 35px;align-self:flex-end;height:68px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;pointer-events:none}
.shelf-ornament .ornament-icon{font-size:25px;line-height:1}.shelf-ornament .ornament-pot{width:24px;height:20px;background:linear-gradient(90deg,#b9a08c,#e4cdb8,#aa8e78);border-radius:2px 2px 9px 9px;box-shadow:2px 2px 3px #463b2c25}
.shelf-ornament.candle .ornament-icon{font-size:18px;color:#9b7450}.shelf-ornament.candle .ornament-pot{width:19px;height:32px;background:linear-gradient(90deg,#e8d7ba,#fff8e9,#d8c7ad);border-radius:3px 3px 2px 2px}
.shelf-ornament.bookend .ornament-icon{font-size:30px;color:#a58d6c}.shelf-ornament.bookend .ornament-pot{height:6px;width:29px;background:#aa906b;border-radius:2px}
.oak-ledge{height:14px;background:linear-gradient(#e3c7a1 0%,#c49b6d 35%,#9c7149 85%,#b68c5f 100%);box-shadow:0 5px 0 #e1c7a5,0 8px 9px #5d422d36}
.shelf-caption{text-align:center;font:italic 11px Georgia,serif;color:#8b8276;margin-top:12px}
@media(max-width:600px){.boutique-shelves{padding:15px 7px 18px}.book-display.spine-display{gap:1px;min-height:160px;padding:8px 2px 0}.spine-book{min-width:16px;border-left-width:2px;border-right-width:1px}.spine-book .spine-title{font-size:9px}.shelf-ornament{flex-basis:26px}.shelf-ornament .ornament-icon{font-size:20px}.shelf-ornament .ornament-pot{width:19px;height:16px}}

/* Literary scrapbook and embossed, illustrated spines */
.spine-book{position:relative;border:1px solid #58473655!important;border-left:3px solid #fff8e577!important;border-right:3px solid #30251e35!important;border-radius:3px 5px 2px 2px!important;background:repeating-linear-gradient(90deg,transparent 0 3px,#ffffff12 3px 4px,transparent 4px 7px),linear-gradient(90deg,#1d18152b,transparent 22%,#ffffff24 60%,#251a1633),var(--book-color)!important;box-shadow:inset 1px 0 #f7e5c377,inset -2px 0 #251a1655,2px 3px 4px #38281c55!important}
.spine-book:before,.spine-book:after{content:'❦';position:absolute;left:2px;right:2px;text-align:center;color:#e9d6a0;font-size:10px;line-height:1;text-shadow:0 1px #4e3e29;writing-mode:horizontal-tb;transform:none}.spine-book:before{top:9px}.spine-book:after{bottom:9px}
.spine-book .spine-title{font-family:Georgia,serif!important;font-weight:bold!important;letter-spacing:.5px;text-shadow:0 1px 1px #271b1744;max-height:calc(var(--book-height) - 49px);overflow:hidden}.spine-book .spine-rule{background:#e7cc92!important;box-shadow:0 0 0 1px #ffffff40}
.journal-overlay{position:fixed;inset:0;z-index:20;background:#302a25a8;overflow:auto;padding:16px 10px 45px;overscroll-behavior:contain}
.journal-sheet{max-width:620px;margin:8px auto;background:#fffcf6;border:1px solid #d7c7b2;box-shadow:0 12px 40px #1b171255;padding:20px 18px 25px;position:relative;background-image:radial-gradient(#d4bca42a .6px,transparent .7px);background-size:10px 10px}
.journal-sheet:before{content:'';position:absolute;inset:8px;border:1px solid #d6c6b2;pointer-events:none}
.journal-inner{position:relative;z-index:1}.journal-kicker{text-transform:uppercase;letter-spacing:3px;font:10px system-ui;color:#8a806c;text-align:center;margin:4px 0 12px}
.journal-heading{text-align:center;font:normal 29px/1.12 Georgia,serif;color:#55453b;margin:7px 0}.journal-author{text-align:center;font:italic 15px Georgia,serif;color:#8a796d;margin:0 0 16px}
.journal-cover{width:135px;height:192px;object-fit:contain;display:block;margin:0 auto 15px;filter:drop-shadow(3px 5px 4px #30261f44)}
.journal-placeholder{width:135px;height:192px;display:flex;align-items:center;justify-content:center;margin:0 auto 15px;padding:15px;background:linear-gradient(135deg,#718376,#b6a58b);color:#fff;text-align:center;box-shadow:4px 5px 7px #3c302a44;font:16px Georgia,serif}
.journal-stamp{display:inline-block;border:1px solid #899782;color:#657965;transform:rotate(-3deg);padding:5px 10px;font:10px system-ui;letter-spacing:2px;text-transform:uppercase}
.journal-metadata{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:18px 0}.journal-field{padding:11px 9px;background:#f4efe7;border-bottom:1px solid #d3c3af;min-width:0}.journal-field small{display:block;text-transform:uppercase;letter-spacing:1.5px;font:10px system-ui;color:#857769;margin-bottom:5px}.journal-field strong{font:14px Georgia,serif;color:#55483e;overflow-wrap:anywhere}
.journal-section{margin:19px 0}.journal-section h3{font:italic 20px Georgia,serif;margin:0 0 8px;color:#697d69}.journal-section p{white-space:pre-wrap;line-height:1.65;font-size:14px;margin:0;color:#544c42}.journal-divider{text-align:center;color:#a69c7e;letter-spacing:8px;margin:16px 0}.journal-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.journal-form-panel{max-width:600px;margin:12px auto}.journal-form-panel textarea{width:100%;min-height:95px;resize:vertical;border:1px solid #dac9be;border-radius:6px;padding:10px;font:14px system-ui;background:white;color:#51483f}
@media(max-width:400px){.journal-sheet{padding:16px 13px 22px}.journal-heading{font-size:25px}.journal-metadata{gap:7px}.journal-field{padding:9px 7px}}
.journal-quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:12px 0 16px}.journal-quick-grid label{display:flex;flex-direction:column;gap:7px;color:#5b5149;font-size:15px}.journal-quick-grid select{width:100%;min-width:0;padding:12px 8px;border:1px solid #b9b4a5;border-radius:8px;background:#fffdf9;color:#4b4037;font-size:16px}.journal-finish{width:100%;padding:15px!important;margin-top:8px}@media(max-width:370px){.journal-quick-grid{grid-template-columns:1fr}}
.journal-field select,.journal-field input{width:100%;max-width:100%;box-sizing:border-box;background:transparent;border:0;border-bottom:1px solid #c9bca9;border-radius:0;padding:8px 0;color:#53483f;font:inherit;font-size:clamp(14px,3.6vw,18px);min-height:40px}.journal-field select:focus,.journal-field input:focus{outline:2px solid #8a9a81;outline-offset:2px}.journal-field{min-width:0}

/* Tap-anywhere journal cards; no select dropdowns on the scrapbook page */
.journal-field.tap-card{cursor:pointer;position:relative;min-height:64px;display:flex;flex-direction:column;justify-content:center;gap:5px;text-align:left;color:#55483e;font:inherit;border:0;border-bottom:1px solid #d3c3af;width:100%;border-radius:0}.journal-field.tap-card strong{font:15px Georgia,serif}.journal-field.tap-card:active{background:#e9e1d5}.journal-field.tap-card:focus-visible{outline:2px solid #72886e;outline-offset:2px}.journal-field.tap-card small{pointer-events:none}.journal-choice-sheet{max-width:440px;margin:7vh auto;background:#fffaf1;border-radius:12px;padding:20px;box-shadow:0 12px 40px #0004}.journal-choice-sheet h3{font:italic 24px Georgia,serif;color:#637b68;margin:4px 0 15px}.journal-choices{display:flex;flex-wrap:wrap;gap:9px}.journal-choices button{flex:1 1 42%;min-height:48px;background:#f2e9df;border:1px solid #cdbca8;color:#594c42;border-radius:9px;font:15px Georgia,serif}.journal-choices button.chosen{background:#dbe5d7;border-color:#698267}.journal-choices.rating-choices button{flex-basis:25%}.journal-field.finish-card{background:#e5ecdf;border-bottom:2px solid #82977a}.journal-field.finish-card strong{color:#536d55}
.goal-stat{font:inherit;cursor:pointer;text-align:center;color:inherit;border:1px solid #bfa6a4;border-radius:12px;background:#f8f0eb;touch-action:manipulation}.goal-stat:active{transform:scale(.98)}

/* Monthly pages: an editorial, single-column gallery rather than playful tiles. */
.month-list{display:flex;flex-direction:column;gap:13px}
.month-editorial{position:relative;display:flex;align-items:center;width:100%;min-height:136px;padding:0;overflow:hidden;text-align:left;background:#fffdf9;border:1px solid #e6ded7;border-radius:15px;box-shadow:0 4px 16px rgba(73,58,53,.055);color:#4c453e}
.month-editorial.is-selected{outline:2px solid #a18a72;outline-offset:1px}
.month-art{position:relative;display:block;flex:0 0 38%;align-self:stretch;overflow:hidden;background:linear-gradient(160deg,var(--sky1),var(--sky2));isolation:isolate}
.month-art-orb,.month-art-land{display:none!important}
.month-art:before{content:'';position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.3),transparent 60%),repeating-linear-gradient(92deg,transparent 0 18px,rgba(255,255,255,.035) 19px 20px);z-index:3}
.month-art-orb{position:absolute;width:62px;height:62px;border-radius:50%;top:16px;right:22%;background:var(--sun);box-shadow:0 0 30px 8px var(--glow)}
.month-art-land{position:absolute;bottom:-46px;left:-30%;width:165%;height:110px;border-radius:50% 50% 0 0;transform:rotate(-9deg);background:var(--hill1)}
.month-art-land.second{bottom:-65px;left:4%;height:104px;transform:rotate(12deg);background:var(--hill2)}
.month-editorial-copy{display:flex;flex-direction:column;justify-content:center;gap:4px;padding:13px 12px 13px 16px;min-width:0;flex:1}
.month-index{font-size:9px;letter-spacing:.22em;color:#98877a;font-weight:700}
.month-editorial-copy strong{font:normal 25px Georgia,serif;color:#51443e}
.month-subtitle{font:italic 13px Georgia,serif;color:#7b7067}
.month-count{font-size:11px;color:#8c8076;margin-top:5px}
.month-chevron{font:30px Georgia,serif;color:#a59486;padding-right:12px}
.month-season-0{--sky1:#b7c8cc;--sky2:#e4e8e2;--sun:#f6f0df;--glow:#faf5e777;--hill1:#a1b5b1;--hill2:#778f8e}
.month-season-1{--sky1:#c6adb1;--sky2:#eee1d9;--sun:#fff0db;--glow:#fff2e166;--hill1:#b9959b;--hill2:#856b7b}
.month-season-2{--sky1:#b6c5ba;--sky2:#e8e5cf;--sun:#f9e6c6;--glow:#f9e6c655;--hill1:#9fae8f;--hill2:#657f71}
.month-season-3{--sky1:#9eafb4;--sky2:#e0ded2;--sun:#f0e9db;--glow:#ffffff44;--hill1:#a4b6a3;--hill2:#637f79}

.leaf-cluster i:nth-child(1){left:2px;top:15px;transform:rotate(-45deg)}.leaf-cluster i:nth-child(2){left:15px;top:9px;transform:rotate(48deg)}.leaf-cluster i:nth-child(3){left:3px;top:1px;transform:rotate(-30deg)}.leaf-cluster i:nth-child(4){left:15px;top:24px;transform:rotate(65deg)}.leaf-cluster i:nth-child(5){left:9px;top:-5px;transform:rotate(8deg)}
.botanical-decor.fern .leaf-cluster i{width:9px;height:18px;background:linear-gradient(130deg,#94a77b,#527354)}
.botanical-decor.ivy .leaf-cluster{transform:rotate(13deg)}.botanical-decor.ivy .leaf-cluster i{border-radius:75% 0 65% 5%;background:linear-gradient(130deg,#6d9567,#315b46)}
.botanical-decor.succulent .leaf-cluster{height:24px}.botanical-decor.succulent .leaf-cluster:before{height:17px}.botanical-decor.succulent .leaf-cluster i{top:7px!important;height:15px;width:12px}
.botanical-decor.olive .leaf-cluster i{width:9px;height:15px;background:linear-gradient(130deg,#a7b393,#617a60)}
.trinket-decor .trinket-base{width:23px;height:5px;background:linear-gradient(#c9b58c,#91794c);border-radius:2px}
.brass-arch{width:19px;height:29px;border:4px solid #b79b62;border-bottom:0;border-radius:13px 13px 0 0;box-shadow:inset 1px 0 #f5e0aa,2px 2px 2px #4a3d2a25}
.vase-neck{width:11px;height:9px;background:#a8a9a0;border-radius:2px}.vase-body{width:24px;height:30px;background:linear-gradient(90deg,#aaa99e,#e1d9c7,#969c91);border-radius:9px 9px 11px 11px;box-shadow:2px 2px 3px #342a2420}
.candle-flame{width:7px;height:11px;border-radius:90% 0 90% 30%;transform:rotate(30deg);background:#c7a36a;margin-bottom:3px}.candle-jar{width:21px;height:28px;border-radius:3px 3px 5px 5px;background:linear-gradient(90deg,#956a44,#cba87a,#8f6242);box-shadow:inset 0 5px #e4d5bc}
.stacked-decor span{width:29px;height:8px;display:block;border-radius:2px;border-bottom:2px solid #d5bf9b;background:#677a6a;transform:rotate(-4deg)}.stacked-decor span:nth-child(2){background:#a17a6b;transform:rotate(4deg)}.stacked-decor span:nth-child(3){background:#b69d70}
.clock-face{display:flex;align-items:center;justify-content:center;width:27px;height:27px;border:4px solid #a28b5f;background:#e8d9bc;border-radius:50%;font:16px Georgia;color:#796343}
@media(max-width:600px){.shelf-ornament.botanical-decor,.shelf-ornament.trinket-decor{flex-basis:19px;min-width:13px;transform:scale(.75);transform-origin:bottom center;margin:0 -3px}.book-display.spine-display{gap:1px}.spine-book{min-width:14px}}

function importSpreadsheetReadBooksOnce(){

 const norm=t=>String(t||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
 let added=0,matched=0,skipped=0;
 for(const item of spreadsheetReadImport){
  const existing=state.books.find(b=>norm(b.title)===norm(item.title)&&(!item.author||!b.author||norm(b.author)===norm(item.author)))
   ||state.books.find(b=>norm(b.title)===norm(item.title));
  if(existing){
   if(/currently reading/i.test(existing.status||'')){skipped++;continue;}
   existing.status=item.status;
   existing.previous=false;
   existing.imported2026=true;
   // Preserve any existing completion date and journal details.
   matched++;
  }else{
   const id=Math.max(0,...state.books.map(b=>Number(b.id)||0))+1;
   state.books.push({...item,id,previous:false,imported2026:true,date:'',started:'',notes:''});
   added++;
  }
 }
 state.spreadsheetReadImport2026Done=true;
 state.spreadsheetReadImport2026Counts={matched,added,skipped};
 save();
}

function shelf(arr,limit=90){
 if(!arr.length)return '<p class="muted">No books on this shelf yet.</p>';

 // Fit a compact row on a phone, and add a small ornament between groups.
 const perRow=9;
 for(let i=0;i<shown.length;i+=perRow){
  const group=shown.slice(i,i+perRow);
  const books=group.map((b,j)=>{
   const n=Number(b.id)||i+j+1;
   const [bg,ink]=palette[(n*7+i+j)%palette.length];
   const h=119+(n*13%38),w=20+(n*7%11);

  }).join('');
  // A consistent 60/40 mix: six botanical accents and four vintage objects per ten accents.
  const accents=['pothos','brass','fern','vase','ivy','candle','succulent','books','olive','clock'];
  const rowIndex=Math.floor(i/perRow);
  const ornament=(kind)=>{
   if(['pothos','fern','ivy','succulent','olive'].includes(kind))return `<span class="shelf-ornament botanical-decor ${kind}" aria-hidden="true"><span class="leaf-cluster"><i></i><i></i><i></i><i></i><i></i></span><span class="plant-pot"></span></span>`;
   if(kind==='brass')return '<span class="shelf-ornament trinket-decor brass-decor" aria-hidden="true"><span class="brass-arch"></span><span class="trinket-base"></span></span>';
   if(kind==='vase')return '<span class="shelf-ornament trinket-decor vase-decor" aria-hidden="true"><span class="vase-neck"></span><span class="vase-body"></span></span>';
   if(kind==='candle')return '<span class="shelf-ornament trinket-decor candle-decor" aria-hidden="true"><span class="candle-flame"></span><span class="candle-jar"></span></span>';
   if(kind==='books')return '<span class="shelf-ornament trinket-decor stacked-decor" aria-hidden="true"><span></span><span></span><span></span></span>';

  };
  const first=ornament(accents[(rowIndex*2)%10]);
  const second=ornament(accents[(rowIndex*2+1)%10]);
  const insertAt=Math.max(2,Math.min(5,Math.ceil(group.length/2)));
  const bookNodes=books.split('</button>');
  const decoratedBooks=group.length>insertAt?bookNodes.slice(0,insertAt).join('</button>')+'</button>'+first+bookNodes.slice(insertAt).join('</button>'):books+first;
  rows.push(`<div class="boutique-row"><div class="book-display spine-display">${decoratedBooks}${second}</div><div class="oak-ledge"></div></div>`);
 }

const recNormalize=s=>String(s||'').toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9]+/g,' ').trim();
function recommendationEligible(b){
 const series=String(b.series||'').trim();
 if(!series)return true;
 const order=recommendationSeriesOrder[series]||Object.entries(recommendationSeriesOrder).find(([k])=>recNormalize(k)===recNormalize(series))?.[1];
 if(!order)return false; // Unknown order: skip series rather than recommend a sequel.
 const index=order.findIndex(t=>recNormalize(t)===recNormalize(b.title));
 if(index<0)return false;
 // The previous installments must all be recorded as read.
 return order.slice(0,index).every(title=>state.books.some(other=>
  recNormalize(other.title)===recNormalize(title)&&read(other)));
}
function recommendationPools(){
 const owned=unreadPhysicalBooks().filter(recommendationEligible);
 const wishlist=state.books.filter(b=>!b.previous&&/want to read|want to buy|wishlist|not owned|to buy/i.test(String(b.status||''))&&!/currently reading|owned - read|read - don/i.test(String(b.status||''))&&!owned.some(x=>x.id===b.id)&&recommendationEligible(b));
 return {owned,wishlist};
}
function recommendedBook(){

}
function pickRecommendation(refresh=true){

 if(!choices.length)choices=pool;
 const b=choices[Math.floor(Math.random()*choices.length)];
 state.recommendedBookId=b?.id??null;save();
 if(refresh)render();
 return b||null;
}

const recommendationSummaryCache={};
async function loadRecommendationSummary(){
 const b=recommendedBook();
 if(!b||recommendationPools().owned.some(x=>x.id===b.id))return;
 const target=document.getElementById('recommend-summary-'+b.id);
 if(!target)return;
 const key=String(b.title||'')+'|'+String(b.author||'');
 const show=value=>{const el=document.getElementById('recommend-summary-'+b.id);if(el&&state.recommendedBookId===b.id)el.textContent=value;};
 if(Object.prototype.hasOwnProperty.call(recommendationSummaryCache,key)){
  show(recommendationSummaryCache[key]||'No publisher description found for this title.');return;
 }
 const norm=v=>String(v||'').toLowerCase().replace(/[^a-z0-9]/g,'');
 const authorMatches=names=>!b.author||(names||[]).some(a=>norm(a)===norm(b.author));
 const clean=v=>String(v||'').replace(/<[^>]*>/g,' ').replace(/&nbsp;/gi,' ').replace(/&amp;/gi,'&').replace(/&quot;/gi,'"').replace(/&#39;/gi,"'").replace(/\s+/g,' ').trim();
 let description='';
 // Google Books is the first source; Open Library is the independent fallback.
 try{
  const q='intitle:'+b.title+' inauthor:'+b.author;
  const r=await fetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(q)+'&maxResults=12');
  if(r.ok){
   const items=(await r.json()).items||[];
   const match=items.map(x=>x.volumeInfo||{}).find(v=>norm(v.title)===norm(b.title)&&authorMatches(v.authors)&&v.description);
   if(match)description=clean(match.description);
  }
 }catch(e){}
 if(!description){
  try{
   const url='https://openlibrary.org/search.json?title='+encodeURIComponent(b.title)+'&author='+encodeURIComponent(b.author||'')+'&limit=10&fields=key,title,author_name,description';
   const res=await fetch(url);
   if(res.ok){
    const docs=(await res.json()).docs||[];
    const match=docs.find(d=>norm(d.title)===norm(b.title)&&authorMatches(d.author_name));
    if(match){
     description=clean(typeof match.description==='string'?match.description:match.description?.value||'');
     if(!description&&/^\/works\/OL\d+W$/.test(match.key||'')){
      const work=await fetch('https://openlibrary.org'+match.key+'.json');
      if(work.ok){const data=await work.json();description=clean(typeof data.description==='string'?data.description:data.description?.value||'');}
     }
    }
   }
  }catch(e){}
 }
 if(description.length>480)description=description.slice(0,477).replace(/\s+\S*$/,'')+'…';
 recommendationSummaryCache[key]=description||null;
 show(description||'No publisher description found for this title. Tap View Book to add your own summary.');
}

async function lookupTotalPages(id){

 try{
  const url='https://openlibrary.org/search.json?title='+encodeURIComponent(b.title)+'&author='+encodeURIComponent(b.author||'')+'&limit=10&fields=title,author_name,number_of_pages_median';
  const response=await fetch(url);
  if(!response.ok)throw Error('Page lookup unavailable');
  const data=await response.json();
  const normalized=t=>String(t||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const title=normalized(b.title),author=normalized(b.author);
  const match=(data.docs||[]).find(d=>normalized(d.title)===title&&(!author||(d.author_name||[]).some(a=>normalized(a)===author))&&Number(d.number_of_pages_median)>0);
  if(match){
   const current=state.books.find(x=>x.id===id);
   if(current&&!(Number(current.totalPages)>0)){
    current.totalPages=Math.round(Number(match.number_of_pages_median));

   }

 }catch(e){b.pageLookupAttempted=false;}
}

 });

function saveCoverChoice(id,url){
 const b=state.books.find(x=>x.id===id);if(!b)return;
 const img=new Image();img.onload=()=>{if(img.naturalWidth<70||img.naturalHeight<100){document.getElementById('cover-picker-error').textContent='That image is too small. Please choose another.';return;}b.coverUrl=url;save();const key=(b.title+'|'+b.author).toLowerCase();coverCache[key]=url;try{localStorage.setItem(coverCacheKey,JSON.stringify(coverCache))}catch(e){}const isAZ=document.querySelector('#overlay .az-detail-sheet');if(isAZ){const letter=Object.keys(state.az||{}).find(k=>String(state.az[k])===String(id));if(letter&&typeof openAzDetail==='function'){openAzDetail(letter);return;}}openBook(id);};img.onerror=()=>{const error=document.getElementById('cover-picker-error');if(error)error.textContent='Could not load that image. Try another cover or link.'};img.src=url;
}
function saveCustomBookCover(id){const url=document.getElementById('custom-cover-url')?.value.trim();if(!url||!/^https:\/\//i.test(url)){document.getElementById('cover-picker-error').textContent='Please enter a full https:// image URL.';return;}saveCoverChoice(id,url)}
async function searchBookCoverChoices(b){
 const node=document.getElementById('cover-picker-results');if(!node)return;
 const norm=t=>String(t||'').toLowerCase().replace(/[^a-z0-9]/g,'');
 const urls=[];
 try{const r=await fetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent('intitle:'+b.title+' inauthor:'+(b.author||''))+'&maxResults=25');if(r.ok){const j=await r.json();for(const item of j.items||[]){const v=item.volumeInfo||{};if(norm(v.title)!==norm(b.title))continue;if(b.author&&!(v.authors||[]).some(a=>norm(a)===norm(b.author)))continue;const img=v.imageLinks||{};if(img.thumbnail||img.smallThumbnail)urls.push((img.thumbnail||img.smallThumbnail).replace(/^http:/,'https:'));}}}catch(e){}
 try{const r=await fetch('https://openlibrary.org/search.json?title='+encodeURIComponent(b.title)+'&author='+encodeURIComponent(b.author||'')+'&limit=20&fields=title,author_name,cover_i');if(r.ok){const j=await r.json();for(const d of j.docs||[]){if(norm(d.title)===norm(b.title)&&d.cover_i)urls.push('https://covers.openlibrary.org/b/id/'+d.cover_i+'-L.jpg?default=false');}}}catch(e){}
 if(!node.isConnected)return;
 const unique=[...new Set(urls)].slice(0,12);
 if(!unique.length){node.textContent='No automatic cover choices found. You can still paste an image link below.';return;}
 node.textContent='';const grid=document.createElement('div');grid.className='cover-picker-grid';
 for(const url of unique){const btn=document.createElement('button');btn.type='button';btn.title='Use this cover';const img=document.createElement('img');img.src=url;img.alt='Suggested cover for '+b.title;img.loading='lazy';img.onerror=()=>btn.remove();btn.appendChild(img);btn.addEventListener('click',()=>saveCoverChoice(b.id,url));grid.appendChild(btn)}node.appendChild(grid);
}
async function loadJournalCover(b){
 const slot=document.getElementById('journal-cover-slot');if(!slot)return;
 const norm=t=>String(t||'').toLowerCase().replace(/[^a-z0-9]/g,'');
 const title=norm(b.title),author=norm(b.author);
 const key=(b.title+'|'+b.author).toLowerCase();
 const candidates=[];
 if(b.coverUrl)candidates.push(b.coverUrl);
 if(coverCache[key])candidates.push(coverCache[key]);
 if(b.isbn)candidates.push('https://covers.openlibrary.org/b/isbn/'+encodeURIComponent(b.isbn)+'-L.jpg?default=false');
 try{
  const r=await fetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent('intitle:'+b.title+' inauthor:'+(b.author||''))+'&maxResults=12');
  if(r.ok){const j=await r.json();for(const item of j.items||[]){const v=item.volumeInfo||{};if(norm(v.title)!==title)continue;if(author&&!(v.authors||[]).some(x=>norm(x)===author))continue;const im=v.imageLinks||{};if(im.thumbnail||im.smallThumbnail)candidates.push((im.thumbnail||im.smallThumbnail).replace(/^http:/,'https:'));}}
 }catch(e){}
 try{
  const r=await fetch('https://openlibrary.org/search.json?title='+encodeURIComponent(b.title)+'&author='+encodeURIComponent(b.author||'')+'&limit=12&fields=title,author_name,cover_i');
  if(r.ok){const j=await r.json();for(const d of j.docs||[]){if(!d.cover_i||norm(d.title)!==title)continue;if(author&&!(d.author_name||[]).some(x=>norm(x)===author))continue;candidates.push('https://covers.openlibrary.org/b/id/'+d.cover_i+'-L.jpg?default=false');}}
 }catch(e){}
 for(const url of [...new Set(candidates)]){
  if(!url||!slot.isConnected||document.getElementById('journal-cover-slot')!==slot)break;
  const ok=await new Promise(resolve=>{const img=new Image();img.onload=()=>resolve(img.naturalWidth>70&&img.naturalHeight>100?img:null);img.onerror=()=>resolve(null);img.src=url;});
  if(ok&&slot.isConnected&&document.getElementById('journal-cover-slot')===slot){ok.className='journal-cover';ok.alt='Cover of '+b.title;slot.replaceChildren(ok);coverCache[key]=url;try{localStorage.setItem(coverCacheKey,JSON.stringify(coverCache))}catch(e){}return;}
 }
}
// Story descriptions are cached separately from personal journal entries.
const storyCacheKey='magical-journal-story-descriptions-v1';
let storyCache={};
try{storyCache=JSON.parse(localStorage.getItem(storyCacheKey)||'{}')||{}}catch(e){}
const storyKey=b=>(b.title||'').trim().toLowerCase()+'|'+(b.author||'').trim().toLowerCase();
const storyNorm=s=>String(s||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function storyDescription(raw){
 if(typeof raw==='string')return raw.trim();
 if(raw&&typeof raw.value==='string')return raw.value.trim();
 return '';
}
async function loadStoryDescription(b){
 if(b.summary)return; // Never overwrite a description the reader entered.
 const node=document.getElementById('journal-story-description');
 if(!node||node.dataset.bookId!==String(b.id))return;
 const key=storyKey(b);
 if(Object.prototype.hasOwnProperty.call(storyCache,key)){
  node.textContent=storyCache[key]||'No automatic description was found for this edition. You can add your own with Edit Entry.';
  return;
 }
 node.textContent='Finding this story’s description…';
 let description='';
 try{
  const search=await fetch('https://openlibrary.org/search.json?title='+encodeURIComponent(b.title||'')+'&author='+encodeURIComponent(b.author||'')+'&limit=5&fields=key,title,author_name,description');
  if(search.ok){
   const result=await search.json();
   const matches=(result.docs||[]).filter(d=>storyNorm(d.title)===storyNorm(b.title)&&(!b.author||(d.author_name||[]).some(a=>storyNorm(a)===storyNorm(b.author))));
   for(const match of matches.slice(0,3)){
    description=storyDescription(match.description);
    if(!description&&/^\/works\/OL\d+W$/.test(match.key||'')){
     const detail=await fetch('https://openlibrary.org'+match.key+'.json');
     if(detail.ok)description=storyDescription((await detail.json()).description);
    }
    if(description)break;
   }
  }
 }catch(e){ /* Offline or service unavailable; retry next time. */ }
 const active=document.getElementById('journal-story-description');
 if(!active||active.dataset.bookId!==String(b.id))return;
 if(description){
  storyCache[key]=description;
  try{localStorage.setItem(storyCacheKey,JSON.stringify(storyCache))}catch(e){}
  active.textContent=description;
 }else{
  active.textContent='A description isn’t available right now. You can add one using Edit Entry.';
 }
}
function openBook(id){
 selectedBook=id;
 if(id===-1){editBook(-1);return}
 const b=state.books.find(x=>x.id===id);if(!b)return;
 closeBook();
 const overlay=document.createElement('div');overlay.id='overlay';overlay.className='journal-overlay';
 const stamp=b.previous?'Previously read':/currently reading/i.test(b.status)?'Currently reading':/read/i.test(b.status)&&!/unread|want to read/i.test(b.status)?'Finished reading':'To be read';
 const val=(x,placeholder='Not yet recorded')=>x?esc(String(x)):placeholder;
 const stars=b.rating?`${'★'.repeat(Math.floor(+b.rating))}${+b.rating%1?'½':''} ${Number(b.rating).toFixed(1)} / 5`:'Not yet rated';
 const spice=b.spice&&b.spice!=='Not rated'?esc(b.spice):'Not yet rated';
 const summary=b.summary?esc(b.summary):'Finding this story’s description…';
 const thoughts=b.thoughts?esc(b.thoughts):'Your personal thoughts and favorite moments will live here once you add them.';
 const isCurrent=/currently reading/i.test(b.status);
 const tile=(field,label,value)=>`<button type="button" class="journal-field tap-card" onclick="editJournalTile(${id},'${field}')"><small>${label}</small><strong>${value}</strong></button>`;
 const quickControls='';
 const startControl=/owned.*unread/i.test(b.status)&&fmt(b)==='Physical'?`<button type="button" class="journal-field tap-card start-card" onclick="startReading(${id})"><small>Ready for your next chapter?</small><strong>📖 Start Reading</strong></button>`:'';
 overlay.innerHTML=`<article class="journal-sheet"><div class="journal-inner"><div class="row between"><span class="journal-stamp">${stamp}</span><button aria-label="Close journal page" onclick="closeBook()">✕</button></div><div class="journal-kicker">✦ The personal reading journal ✦</div>${journalCover(b)}<h2 class="journal-heading">${esc(b.title)}</h2><p class="journal-author">by ${esc(b.author||'Unknown author')}</p><div class="journal-divider">❦ ✧ ❦</div><div class="journal-metadata">${tile('rating','My rating',stars)}${tile('spice','Spice level',spice)}${tile('started','Date started',val(b.started))}${tile('date','Date finished',val(b.date))}${tile('format','Format',val(b.format))}${tile('mood','Reading mood',val(b.mood))}${isCurrent?`<button type="button" class="journal-field tap-card finish-card" onclick="finishReading(${id})"><small>Reading progress</small><strong>✓ Finished Reading</strong></button>`:''}${startControl}</div><section class="journal-section"><h3>About the story</h3><p id="journal-story-description" data-book-id="${id}">${summary}</p></section>${quickControls}<div class="journal-divider">✧ ❦ ✧</div><section class="journal-section"><h3>My thoughts</h3><p>${thoughts}</p></section><div class="journal-actions"><button class="primary" onclick="editBook(${id})">✎ Edit Entry</button><button type="button" onclick="changeBookCover(${id})">🖼 Change Book Cover</button><button onclick="closeBook()">Back to my shelves</button></div></div></article>`;
 document.body.appendChild(overlay);loadJournalCover(b);loadStoryDescription(b);
}
function editJournalTile(id,field){
 const b=state.books.find(x=>x.id===id);if(!b)return;
 if(field==='started'||field==='date'){
  const current=b[field]||new Date().toLocaleDateString('en-CA');
  const input=document.createElement('input');input.type='date';input.value=current;
  input.style.cssText='position:fixed;left:50%;top:45%;z-index:10010;transform:translate(-50%,-50%);font-size:20px;padding:15px;background:#fffaf1;border:2px solid #8a9a81;border-radius:10px';
  const backdrop=document.createElement('div');backdrop.style.cssText='position:fixed;inset:0;background:#0008;z-index:10009';
  const done=()=>{backdrop.remove();input.remove()};backdrop.onclick=done;
  input.onchange=()=>{inlineJournalUpdate(id,field,input.value);done();openBook(id)};
  document.body.append(backdrop,input);input.focus();if(input.showPicker)try{input.showPicker()}catch(e){};return;
 }
 const sets={rating:[['','Not rated'],...Array.from({length:10},(_,i)=>[String((i+1)/2),((i+1)/2)+' ★'])],spice:['Not rated','None','Mild','Medium','Spicy','Extra spicy'].map(x=>[x,x]),format:['Physical','Kindle/eBook','Audiobook'].map(x=>[x,x]),mood:['','😍 Completely obsessed','💕 Loved it','🙂 It was okay','😬 Not for me','📖 Did not finish'].map(x=>[x,x||'Not recorded'])};
 const labels={rating:'My rating',spice:'Spice level',format:'Book format',mood:'Reading mood'};
 if(!sets[field])return;
 const pop=document.createElement('div');pop.id='journal-picker';pop.className='journal-overlay';pop.style.zIndex='10008';
 pop.innerHTML=`<div class="journal-choice-sheet"><div class="row between"><h3>${labels[field]}</h3><button onclick="document.getElementById('journal-picker').remove()">✕</button></div><div class="journal-choices ${field==='rating'?'rating-choices':''}">${sets[field].map(([v,label],i)=>`<button type="button" class="${String(b[field]||'')===v?'chosen':''}" data-choice="${i}">${esc(label)}</button>`).join('')}</div></div>`;
 document.body.appendChild(pop);
 pop.querySelectorAll('[data-choice]').forEach(btn=>btn.onclick=()=>{const v=sets[field][Number(btn.dataset.choice)][0];inlineJournalUpdate(id,field,v);pop.remove();openBook(id)});
 pop.addEventListener('click',e=>{if(e.target===pop)pop.remove()});
}
function inlineJournalUpdate(id,field,value){
 const b=state.books.find(x=>x.id===id);
 if(!b||!['rating','spice','started','date','format','mood'].includes(field))return;
 b[field]=field==='rating'?(value?Number(value):null):value;
 save(); // Keep the page open and avoid resetting scroll position.
}
function quickUpdateBook(id,field,value){
 const b=state.books.find(x=>x.id===id);if(!b||!['rating','spice'].includes(field))return;
 b[field]=field==='rating'?(value?Number(value):null):value;
 save();render();
 // Refresh the journal display so the summary tiles reflect the saved selection.
 openBook(id);
}
function finishReading(id){
 const b=state.books.find(x=>x.id===id);if(!b||!/currently reading/i.test(b.status))return;
 b.status=b.format==='Physical'?'Owned - Read':'Read - Don\'t Own';
 b.date=new Date().toLocaleDateString('en-CA');
 b.previous=false;
 save();render();openBook(id);
}
function editBook(id){
 selectedBook=id;const b=state.books.find(x=>x.id===id)||{title:'',author:'',status:'Owned - Unread',format:'Physical',date:'',started:'',genre:'',rating:'',previous:false,series:'',summary:'',thoughts:''};closeBook();
 const overlay=document.createElement('div');overlay.id='overlay';overlay.className='journal-overlay';
 overlay.innerHTML=`<div class="panel journal-form-panel"><div class="row between"><h2>✿ ${id===-1?'Add a book':'Edit Journal Entry'}</h2><button onclick="${id===-1?'closeBook()':`openBook(${id})`}">✕</button></div><form id="bookform" class="form" onsubmit="saveBook(event)"><label class="full">Title<input name="title" required value="${esc(b.title)}"></label><label class="full">Author<input name="author" value="${esc(b.author)}"></label><label>Status<select name="status">${['Owned - Unread','Currently Reading','Owned - Read','Read - Don\'t Own','Want to Read','Want to Buy','Did Not Finish'].map(x=>`<option ${b.status===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label>Format<select name="format">${['Physical','Kindle/eBook','Audiobook'].map(x=>`<option ${b.format===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Date started<input type="date" name="started" value="${esc(b.started||'')}"></label><label>Date finished<input type="date" name="date" value="${esc(b.date||'')}"></label><label>Total pages in book<input type="number" name="totalPages" min="1" max="100000" inputmode="numeric" placeholder="e.g. 384" value="${Number(b.totalPages)>0?Number(b.totalPages):''}"></label><label>Half-star rating<select name="rating"><option value="">Not rated</option>${Array.from({length:10},(_,i)=>(i+1)/2).map(n=>`<option value="${n}" ${+b.rating===n?'selected':''}>${n} ★</option>`).join('')}</select></label><label>Spice level<select name="spice">${['Not rated','None','Mild','Medium','Spicy','Extra spicy'].map(x=>`<option ${b.spice===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="full">Genre<input name="genre" value="${esc(b.genre||'')}"></label><label class="full">Reading mood<select name="mood">${['','😍 Completely obsessed','💕 Loved it','🙂 It was okay','😬 Not for me','📖 Did not finish'].map(x=>`<option ${b.mood===x?'selected':''}>${x||'Not selected'}</option>`).join('')}</select></label><label class="full">Spoiler-free summary<textarea name="summary" placeholder="What is this story about?">${esc(b.summary||'')}</textarea></label><label class="full">My thoughts<textarea name="thoughts" placeholder="Your favorite moments, feelings, and review...">${esc(b.thoughts||'')}</textarea></label><label class="full"><span class="row"><input type="checkbox" name="previous" ${b.previous?'checked':''}> Previously read (not counted in yearly stats)</span></label><button class="primary full" type="submit">Save journal entry ♡</button></form></div>`;
 document.body.appendChild(overlay);
}
function closeBook(){document.getElementById('overlay')?.remove()}
function saveBook(e){e.preventDefault();const f=new FormData(e.target),old=state.books.find(x=>x.id===selectedBook);const b={...(old||{}),id:old?.id||Math.max(0,...state.books.map(x=>x.id))+1};for(let k of ['title','author','status','format','date','started','genre','mood','spice','summary','thoughts'])b[k]=f.get(k);if(b.status==='Currently Reading'&&!b.started)b.started=new Date().toLocaleDateString('en-CA');b.totalPages=f.get('totalPages')?Math.max(1,Math.round(Number(f.get('totalPages')))):null;if(b.totalPages)b.pageCountSource='Manually entered';b.rating=f.get('rating')?+f.get('rating'):null;b.previous=!!f.get('previous');if(old)Object.assign(old,b);else state.books.push(b);save();closeBook();render();openBook(b.id)}
function settings(){return `<div class="panel"><h2>🌷 Journal Settings & Backup</h2><label style="max-width:220px">Yearly reading goal<input type="number" min="1" max="1000" value="${state.goal}" onchange="state.goal=Math.max(1,+this.value||50);save();render()"></label><h3>Keep your reading history safe</h3><p>Your changes save automatically in this browser's local storage. They do not sync to other devices or update the original Excel workbook. Export a backup after logging books.</p><div class="row"><button class="primary" onclick="backup()">↓ Download journal backup</button><label>Restore a saved backup<input type="file" accept=".json" onchange="restore(this)"></label></div><div class="note"><h3>🛍️ Want to Buy</h3><button onclick="go('wantToBuy')">Open Want to Buy →</button>${(state.shoppingList||[]).length?(state.shoppingList||[]).map(id=>state.books.find(b=>b.id===id)).filter(Boolean).map(b=>`<div class="bookrow"><span>${esc(b.title)} — ${esc(b.author||'')}</span><button onclick="state.shoppingList=state.shoppingList.filter(id=>id!==${b.id});save();render()">Remove</button></div>`).join(''):'No books on your shopping list yet.'}</div><div class="note">Imported ${seed.length} book records from your bookshelf. Existing read books with no known finish date are marked Previously Read. You can adjust them individually.</div></div>`}
render();
</script></body></html>

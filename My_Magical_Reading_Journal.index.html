if(!state||!Array.isArray(state.books))state={books:seed.map((b,i)=>({...b,id:i+1,previous:/^(Owned - Read|Read - Don.t Own)$/i.test(b.status)&&(!b.date||b.date<'2026-09-01')})),goal:50,bingo:{},alphabet:{},monthlyGoals:{},year:2027};
let page='home',month=0,query='',selectedBook=null;
const months=['January','February','March','April','May','June','July','August','September','October','November','December'];

const save=()=>{localStorage.setItem(KEY,JSON.stringify(state))};
const read=b=>/^(Owned - Read|Read - Don.t Own)$/i.test(b.status);
const finished=b=>read(b)&&b.date&&b.date>='2026-09-01'&&!b.previous;
const yearBooks=y=>state.books.filter(b=>finished(b)&&b.date.startsWith(String(y)));
const oldBooks=()=>state.books.filter(b=>read(b)&&b.previous);
const fmt=b=>/kindle|ebook|e-book/i.test(b.format)?'Kindle':'Physical';

function shelf(arr,limit=90){if(!arr.length)return '<p class="muted">Your shelf is waiting for its first book ♡</p>';return '<div class="shelf">'+arr.slice(0,limit).map((b,i)=>`<div class="spine" title="${esc(b.title)} — ${esc(b.author)}" style="height:${80+(i*13)%55}px;background:${color(i)}" onclick="openBook(${b.id})">${esc(b.title)}</div>`).join('')+'</div>'+(arr.length>limit?`<p class="muted">Showing ${limit} of ${arr.length} books. Use search below to find more.</p>`:'')}
function progress(n,d){return `<div class="bar"><div style="width:${Math.min(100,Math.round(100*n/Math.max(1,d)))}%"></div></div>`}
function render(){const nav=[['home','Home'],['months','Monthly Pages'],['previous','Previously Read'],['alphabet','A–Z Challenge'],['bingo','Reading Bingo'],['stats','Reading Stats'],['library','All Books'],['settings','Settings & Backup']];document.getElementById('nav').innerHTML=nav.map(([k,v])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('');document.getElementById('view').innerHTML=({home,monthsPage,previous,alphabet,bingo,stats,library,settings})[page==='months'?'monthsPage':page]();}
function go(p){page=p;query='';render();window.scrollTo(0,0)}
function home(){const y=yearBooks(state.year),active=state.books.filter(b=>/currently reading/i.test(b.status));return `<div class="panel"><div class="row between"><h2>✿ ${state.year} Reading Dashboard</h2><select onchange="state.year=+this.value;save();render()">${[2026,2027,2028,2029].map(y=>`<option ${state.year===y?'selected':''}>${y}</option>`).join('')}</select></div><div class="cards"><div class="stat"><strong>${active.length}</strong>Currently Reading</div><div class="stat"><strong>${y.length}</strong>Books Read</div><div class="stat"><strong>${state.goal}</strong>Yearly Goal</div></div><p class="muted">${y.length} of ${state.goal} books finished</p>${progress(y.length,state.goal)}<h3>📖 Currently Reading</h3>${active.length?active.map(b=>`<div class="bookrow"><div style="flex:1">${esc(b.title)}<small>${esc(b.author)}</small></div><button onclick="openBook(${b.id})">Finish / Edit</button></div>`).join(''):'<p class="muted">Nothing on your nightstand right now.</p>'}<div class="row"><button class="primary" onclick="go('library')">+ Log a book</button><button onclick="go('months')">Explore monthly pages</button></div></div><div class="panel"><h2>🌷 My Magical Bookshelf</h2>${shelf(y)}<p class="muted">Books finished in ${state.year}. Tap a spine for book details.</p></div><div class="panel"><h2>✨ A Little Reading Magic</h2><div class="grid"><div class="note">${oldBooks().length} previously read books in your vintage library. <button onclick="go('previous')">Visit shelf</button></div><div class="note">${Object.keys(state.alphabet[state.year]||{}).length} alphabet letters recorded. <button onclick="go('alphabet')">View challenge</button></div></div></div>`}
function monthsPage(){const y=state.year,arr=yearBooks(y),m=month,books=arr.filter(b=>+b.date.slice(5,7)===m+1),goal=state.monthlyGoals[y+'-'+m]??4;const unread=state.books.filter(b=>/unread|want to read|want to buy/i.test(b.status));let rec=unread.filter(b=>/owned/i.test(b.status));if(!rec.length)rec=unread;const pick=rec[(m*17+7)%Math.max(1,rec.length)];return `<div class="panel"><h2>🌼 ${y} Monthly Reading Pages</h2><div class="monthgrid">${months.map((name,i)=>`<button class="month" style="background:${i===m?'#e5d6f1':'#f6edf6'}" onclick="month=${i};render()"><b>${name}</b><span>${subtitles[i]} · ${arr.filter(b=>+b.date.slice(5,7)===i+1).length} books</span></button>`).join('')}</div></div><div class="panel"><h2>${months[m]} · ${subtitles[m]}</h2><div class="row between"><span>${books.length} books finished</span><label>Monthly goal<input type="number" min="1" max="100" value="${goal}" style="width:80px" onchange="state.monthlyGoals['${y}-${m}']=+this.value;save();render()"></label></div>${progress(books.length,goal)}<h3>My Mini Bookshelf</h3>${shelf(books)}<h3>🌟 Book of the Month</h3>${books.length?esc([...books].sort((a,b)=>(b.rating||0)-(a.rating||0))[0].title):'<span class="muted">Finish a book to unlock your spotlight!</span>'}<h3>🌙 Your Next Chapter</h3><div class="note"><span class="pill">Shop Your Shelves</span><p>${pick?`<b>${esc(pick.title)}</b> by ${esc(pick.author)}`:'Add unread books to your library to receive recommendations.'}</p><button onclick="month=(month+1)%12;render()">Explore another month</button></div></div>`}
function previous(){let arr=oldBooks().filter(b=>(b.title+' '+b.author).toLowerCase().includes(query.toLowerCase()));return `<div class="panel"><h2>✿ My Previously Read Books</h2><p>The stories that brought me here ♡ · ${oldBooks().length} books</p><div class="row"><input type="search" placeholder="Find a title or author" value="${esc(query)}" oninput="query=this.value;render()"><button onclick="shufflePrevious()">⇄ Shuffle My Shelves</button></div>${shelf(arr,150)}<p class="muted">Your shelf is in a mixed, stable order. Shuffle to rearrange it.</p><div class="booklist">${arr.map(b=>`<div class="bookrow"><span>📚</span><div style="flex:1">${esc(b.title)}<small>${esc(b.author)}</small></div><button onclick="openBook(${b.id})">Details</button></div>`).join('')}</div></div>`}
function shufflePrevious(){const old=state.books.filter(b=>b.previous&&read(b));for(let i=old.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[old[i],old[j]]=[old[j],old[i]]}const ids=old.map(x=>x.id),order=new Map(ids.map((x,i)=>[x,i]));state.books.sort((a,b)=>(order.get(a.id)??99999)-(order.get(b.id)??99999));save();render()}
function alphabet(){const y=state.year, entries=state.alphabet[y]||{},letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');return `<div class="panel"><h2>🌸 ${y} A–Z Reading Challenge</h2><p>26 letters · 26 little adventures ♡</p><p><b>${Object.keys(entries).length} / 26 completed</b></p>${progress(Object.keys(entries).length,26)}<p class="muted">Tap a letter to select a finished book. Titles beginning with A, An, or The use the next word.</p>${letters.map(l=>`<div class="bookrow ${entries[l]?'done':''}"><div class="letter">${l}</div><div style="flex:1">${entries[l]?esc((state.books.find(b=>b.id===entries[l])||{}).title||'Book not found'):'<span class="muted">Waiting for a book...</span>'}</div><button onclick="chooseLetter('${l}')">${entries[l]?'Change':'Add'}</button></div>`).join('')}</div>`}
function chooseLetter(l){const options=yearBooks(state.year).filter(b=>b.title.replace(/^(the|a|an)\s+/i,'').toUpperCase().startsWith(l));let chosen=prompt(`Letter ${l}: Enter the exact title of a book you finished in ${state.year}.\n${options.length?'Matching books: '+options.map(x=>x.title).join('; '):'No matching finished books yet.'}`);if(chosen===null)return;let b=options.find(x=>x.title.toLowerCase()===chosen.trim().toLowerCase());if(!chosen.trim()){delete (state.alphabet[state.year]||{})[l];save();render();return}if(!b){alert('Please finish and date a matching book in your library first, then select it here.');return}state.alphabet[state.year]??={};state.alphabet[state.year][l]=b.id;save();render()}
function bingo(){const y=state.year;state.bingo[y]??={};const done=i=>i===12||!!state.bingo[y][i];let completed=challenges.filter((_,i)=>done(i)).length;let lines=[];for(let r=0;r<5;r++)lines.push(Array.from({length:5},(_,c)=>r*5+c));for(let c=0;c<5;c++)lines.push(Array.from({length:5},(_,r)=>r*5+c));lines.push([0,6,12,18,24],[4,8,12,16,20]);let wins=lines.filter(line=>line.every(done)).length;return `<div class="panel"><h2>🎀 ${y} Reading Bingo</h2><p>17 relaxed prompts · 7 little challenges · 1 free space</p><div class="row between"><b>${completed}/25 squares</b><span>${wins} bingo${wins===1?'':'s'}</span></div>${progress(completed,25)}<div class="bingo" style="margin-top:16px">${challenges.map((c,i)=>`<button class="tile ${hard.includes(i)?'hard':''} ${done(i)?'done':''}" onclick="toggleBingo(${i})">${done(i)?'✓ ':''}${esc(c)}</button>`).join('')}</div><p class="muted">Tap a square to mark it complete. You can use a book for more than one challenge.</p><button onclick="if(confirm('Clear this year’s Bingo progress?')){state.bingo[state.year]={};save();render()}">Reset Bingo</button></div>`}
function toggleBingo(i){if(i===12)return;state.bingo[state.year]??={};state.bingo[state.year][i]=!state.bingo[state.year][i];save();render()}
function stats(){const arr=yearBooks(state.year),kindle=arr.filter(b=>fmt(b)==='Kindle').length,ratings=arr.filter(b=>b.rating===5).length,genres={};arr.forEach(b=>{if(b.genre)genres[b.genre]=(genres[b.genre]||0)+1});return `<div class="panel"><h2>✨ ${state.year} Reading Stats</h2><p class="muted">Automatically calculated from books with finish dates in ${state.year}.</p><div class="cards"><div class="stat"><strong>${arr.length}</strong>Books finished</div><div class="stat"><strong>${ratings}</strong>Five-star reads</div><div class="stat"><strong>${kindle}</strong>Kindle books</div></div><h3>Books read each month</h3><div style="display:flex;align-items:end;gap:6px;height:160px;border-bottom:2px solid #dccddd">${months.map((m,i)=>{let n=arr.filter(b=>+b.date.slice(5,7)===i+1).length;return `<div style="flex:1;text-align:center;font-size:10px"><div>${n||''}</div><div style="height:${Math.max(2,n*17)}px;background:${color(i)};border-radius:5px 5px 0 0"></div><div>${m.slice(0,3)}</div></div>`}).join('')}</div><h3>Physical vs Kindle</h3><p>📖 Physical: ${arr.length-kindle} · 📱 Kindle: ${kindle}</p><h3>Favorite genres by books read</h3>${Object.entries(genres).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,n])=>`<div class="row between"><span>${esc(k)}</span><b>${n}</b></div>`).join('')||'<p class="muted">Genre stats will appear as you finish books.</p>'}</div>`}
function library(){let arr=state.books.filter(b=>(b.title+' '+b.author).toLowerCase().includes(query.toLowerCase())).slice(0,120);return `<div class="panel"><h2>📚 My Digital Book Collection</h2><p>${state.books.length} books imported from your existing spreadsheet.</p><div class="row"><input type="search" placeholder="Search titles or authors" value="${esc(query)}" oninput="query=this.value;render()"><button class="primary" onclick="openBook(-1)">+ Add a book</button></div><div class="booklist">${arr.map(b=>`<div class="bookrow"><span>📖</span><div style="flex:1"><b>${esc(b.title)}</b><small>${esc(b.author)} · ${esc(b.status)}</small></div><button onclick="openBook(${b.id})">Edit</button></div>`).join('')}</div>${arr.length===120?'<p class="muted">Showing the first 120 matches. Search to narrow results.</p>':''}</div>`}
function openBook(id){selectedBook=id;const b=state.books.find(x=>x.id===id)||{title:'',author:'',status:'Owned - Unread',format:'Physical',date:'',genre:'',rating:'',previous:false,series:''};const overlay=document.createElement('div');overlay.id='overlay';overlay.style='position:fixed;inset:0;background:#34263d99;z-index:9;overflow:auto;padding:25px 10px';overlay.innerHTML=`<div class="panel" style="max-width:550px;margin:10px auto"><div class="row between"><h2>✿ ${id===-1?'Add a book':'Book Details'}</h2><button onclick="closeBook()">✕</button></div><form id="bookform" class="form" onsubmit="saveBook(event)"><label class="full">Title<input name="title" required value="${esc(b.title)}"></label><label class="full">Author<input name="author" value="${esc(b.author)}"></label><label>Status<select name="status">${['Owned - Unread','Currently Reading','Owned - Read','Read - Don\'t Own','Want to Read','Want to Buy','Did Not Finish'].map(x=>`<option ${b.status===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label>Format<select name="format">${['Physical','Kindle/eBook','Audiobook'].map(x=>`<option ${b.format===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Finish date<input type="date" name="date" value="${esc(b.date)}"></label><label>Half-star rating<select name="rating"><option value="">Not rated</option>${Array.from({length:10},(_,i)=>(i+1)/2).map(n=>`<option value="${n}" ${+b.rating===n?'selected':''}>${n} ★</option>`).join('')}</select></label><label class="full">Genre (optional)<input name="genre" value="${esc(b.genre)}"></label><label class="full">How did it make you feel? (optional)<select name="mood">${['','😍 Completely obsessed','💕 Loved it','🙂 It was okay','😬 Not for me','📖 Did not finish'].map(x=>`<option ${b.mood===x?'selected':''}>${x||'Not selected'}</option>`).join('')}</select></label><label class="full">Spice level (optional)<select name="spice">${['Not rated','None','Mild','Medium','Spicy','Extra spicy'].map(x=>`<option ${b.spice===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="full"><span class="row"><input type="checkbox" name="previous" ${b.previous?'checked':''}> Previously read (not counted in yearly stats)</span></label><button class="primary full" type="submit">Save book ♡</button></form><p class="muted">Only the title is required. For a book to count in a specific month or year, enter its finish date and mark it as read.</p></div>`;document.body.appendChild(overlay)}
function closeBook(){document.getElementById('overlay')?.remove()}
function saveBook(e){e.preventDefault();const f=new FormData(e.target),old=state.books.find(x=>x.id===selectedBook);const b={...(old||{}),id:old?.id||Math.max(0,...state.books.map(x=>x.id))+1};for(let k of ['title','author','status','format','date','genre','mood','spice'])b[k]=f.get(k);b.rating=f.get('rating')?+f.get('rating'):null;b.previous=!!f.get('previous');if(old)Object.assign(old,b);else state.books.push(b);save();closeBook();render()}
function settings(){return `<div class="panel"><h2>🌷 Journal Settings & Backup</h2><label style="max-width:220px">Yearly reading goal<input type="number" min="1" max="1000" value="${state.goal}" onchange="state.goal=Math.max(1,+this.value||50);save();render()"></label><h3>Keep your reading history safe</h3><p>Your changes save automatically in this browser's local storage. They do not sync to other devices or update the original Excel workbook. Export a backup after logging books.</p><div class="row"><button class="primary" onclick="backup()">↓ Download journal backup</button><label>Restore a saved backup<input type="file" accept=".json" onchange="restore(this)"></label></div><div class="note">Imported ${seed.length} book records from your bookshelf. Existing read books with no known finish date are marked Previously Read. You can adjust them individually.</div></div>`}
function backup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='My_Magical_Reading_Journal_Backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function restore(input){const f=input.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!Array.isArray(obj.books))throw Error('Missing books');if(!confirm('Replace this browser’s journal with the backup?'))return;state=obj;save();render();alert('Backup restored!')}catch(e){alert('That file is not a valid journal backup.')}}
render();
</script></body></html>
